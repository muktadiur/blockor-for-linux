blockord="/usr/local/libexec/blockor/blockord.sh"
blockor="/usr/local/bin/blockor"
# Failed-attempt counts. Keep it in a directory only root can write.
blockor_file="/var/lib/blockor/blockedlist"
# Firewall that blocks IPs: "auto" takes the first that works of nftables,
# ufw (only when active), firewalld (only when running) and iptables.
# Set one of those names to force it.
firewall="auto"
# Where to read sshd's log: "auto" prefers the systemd journal. "journal"
# forces it. Use "file" only for a file fed by a trusted SSH log source.
log_source="auto"
auth_file="/var/log/auth.log"
blockor_log_file="/var/log/blockord.log"
# Space-separated IPs that are never blocked. Add your own IP here.
blockor_whitelist=""
# Select messages from the formats below. Other formats are ignored even
# when an existing config includes them.
search_pattern="Failed password|Invalid user|Bad protocol version identification|Disconnected from authenticating user root"
max_tolerance=10
